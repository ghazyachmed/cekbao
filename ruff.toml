# Project lint configuration (added 2026-10-28). Without it, ruff used machine-wide settings.
line-length = 130
target-version = "py311"
extend-exclude = ["policyguard/migrations/versions"]   # generated by alembic autogenerate

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]   # FastAPI dependency injection uses calls in argument defaults by design
