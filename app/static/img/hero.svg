<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="A payment request is checked against the official university record before payment">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24c7ac"/><stop offset="1" stop-color="#0e7f6d"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="420" height="220" rx="20" fill="#112335"/>
  <circle cx="64" cy="40" r="3" fill="#24c7ac" opacity=".6"/><circle cx="360" cy="30" r="2" fill="#f5c862" opacity=".7"/><circle cx="390" cy="190" r="3" fill="#24c7ac" opacity=".5"/><circle cx="30" cy="180" r="2" fill="#a1b5c4" opacity=".6"/>
  <!-- envelope -->
  <g transform="translate(34 70)">
    <rect width="104" height="72" rx="10" fill="#eaf1f6"/>
    <path d="M6 10 L52 44 L98 10" fill="none" stroke="#a1b5c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="98" cy="4" r="17" fill="#c8323f"/>
    <rect x="95.5" y="-6" width="5" height="12" rx="2" fill="#fff"/><circle cx="98" cy="11" r="2.6" fill="#fff"/>
  </g>
  <!-- arrow -->
  <path d="M150 106 H186" stroke="#a1b5c4" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M184 96 L196 106 L184 116" fill="none" stroke="#a1b5c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shield -->
  <g transform="translate(206 46)">
    <path d="M50 0 L96 16 V58 C96 92 74 112 50 124 C26 112 4 92 4 58 V16 Z" fill="url(#g)"/>
    <path d="M28 62 L44 78 L74 46" fill="none" stroke="#0b1b2b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- arrow -->
  <path d="M312 106 H338" stroke="#a1b5c4" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
  <!-- university -->
  <g transform="translate(340 66)" fill="#f5c862">
    <path d="M0 26 L34 6 L68 26 Z"/>
    <rect x="4" y="30" width="60" height="6" rx="2"/>
    <rect x="8" y="40" width="8" height="30" rx="2"/><rect x="22" y="40" width="8" height="30" rx="2"/><rect x="38" y="40" width="8" height="30" rx="2"/><rect x="52" y="40" width="8" height="30" rx="2"/>
    <rect x="2" y="74" width="64" height="8" rx="2"/>
  </g>
  <text x="86" y="176" text-anchor="middle" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#a1b5c4">Request</text>
  <text x="256" y="196" text-anchor="middle" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#a1b5c4">CEKBAO check</text>
  <text x="374" y="176" text-anchor="middle" font-family="Lato, system-ui, sans-serif" font-size="13" fill="#a1b5c4">Official route</text>
</svg>
